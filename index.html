<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Key Access</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box;
      font-family:'Segoe UI','Inter',system-ui,sans-serif; }
  html, body { height:100%; overflow:hidden; }
  body {
    display:flex; align-items:center; justify-content:center;
    background:#000;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,0.08), transparent 45%),
      radial-gradient(circle at 80% 70%, rgba(255,255,255,0.06), transparent 45%);
    position:relative;
  }
  body::before {
    content:""; position:fixed; inset:0;
    background:radial-gradient(circle at 50% 50%, transparent 0%, rgba(0,0,0,0.65) 100%);
    pointer-events:none; z-index:0;
  }
  .orb {
    position:fixed; border-radius:50%; filter:blur(80px); opacity:.35;
    pointer-events:none; z-index:0; animation:float 12s ease-in-out infinite;
  }
  .orb.one { width:420px; height:420px; background:#fff; top:-120px; left:-120px; }
  .orb.two { width:380px; height:380px; background:#888; bottom:-140px; right:-100px; animation-delay:-4s; }
  @keyframes float {
    0%,100% { transform:translate(0,0) scale(1); }
    50%     { transform:translate(30px,-25px) scale(1.08); }
  }

  .menu {
    position:relative; z-index:2;
    width:min(520px, 92vw);
    padding:48px 40px 44px;
    border-radius:24px;
    background:rgba(12,12,12,0.72);
    backdrop-filter:blur(22px) saturate(160%);
    -webkit-backdrop-filter:blur(22px) saturate(160%);
    border:1px solid rgba(255,255,255,0.10);
    box-shadow:0 30px 80px rgba(0,0,0,0.75), inset 0 1px 0 rgba(255,255,255,0.06);
    display:flex; flex-direction:column; gap:28px;
    animation:rise .9s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes rise {
    from { opacity:0; transform:translateY(28px) scale(.98); }
    to   { opacity:1; transform:translateY(0) scale(1); }
  }

  .header { text-align:center; display:flex; flex-direction:column; gap:8px; }
  .header h1 {
    font-size:26px; font-weight:800; letter-spacing:.14em; text-transform:uppercase;
    background:linear-gradient(90deg,#fff 0%,#b8b8b8 50%,#fff 100%);
    background-size:200% auto;
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:shine 4s linear infinite;
  }
  @keyframes shine { to { background-position:200% center; } }
  .header p {
    font-size:12.5px; letter-spacing:.22em;
    color:rgba(255,255,255,0.45); text-transform:uppercase;
  }

  .input-wrap {
    position:relative; border-radius:16px; padding:2px;
    background:conic-gradient(from var(--angle,0deg),#fff,#6b6b6b,#fff,#6b6b6b,#fff);
    animation:rotate-border 6s linear infinite;
    isolation:isolate;
  }
  @property --angle { syntax:"<angle>"; initial-value:0deg; inherits:false; }
  @keyframes rotate-border { to { --angle:360deg; } }
  .input-wrap::after {
    content:""; position:absolute; inset:-6px; border-radius:20px;
    background:inherit; filter:blur(18px); opacity:.55; z-index:-1;
    animation:rotate-border 6s linear infinite;
  }

  #keyInput {
    width:100%; padding:20px 22px; border-radius:14px; border:none; outline:none;
    background:#fff; color:#0a0a0a; font-size:15px; font-weight:600;
    letter-spacing:.06em; text-align:center; caret-color:#000;
    box-shadow:inset 0 2px 10px rgba(0,0,0,.08), inset 0 -1px 0 rgba(0,0,0,.04);
    transition:transform .25s ease, box-shadow .25s ease;
    position:relative; z-index:1;
  }
  #keyInput::placeholder { color:rgba(0,0,0,.28); letter-spacing:.14em; font-weight:500; }
  #keyInput:focus {
    transform:translateY(-1px);
    box-shadow:inset 0 2px 10px rgba(0,0,0,.08),
               0 0 0 4px rgba(255,255,255,.15),
               0 0 40px rgba(255,255,255,.20);
  }

  .buttons {
    display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; margin-top:4px;
  }
  .btn {
    position:relative; padding:15px 10px; border-radius:12px;
    background:transparent; border:1.5px solid rgba(255,255,255,0.28);
    color:#fff; font-size:13px; font-weight:700; letter-spacing:.10em;
    text-transform:uppercase; cursor:pointer; overflow:hidden;
    transition:color .35s ease, border-color .35s ease,
               transform .25s ease, box-shadow .35s ease;
    font-family:inherit;
  }
  .btn::before {
    content:""; position:absolute; inset:0; background:#fff;
    transform:scaleY(0); transform-origin:bottom;
    transition:transform .4s cubic-bezier(.65,0,.35,1);
    z-index:-1;
  }
  .btn:hover {
    color:#0a0a0a; border-color:#fff; transform:translateY(-2px);
    box-shadow:0 10px 28px rgba(255,255,255,.18),
               0 0 0 1px rgba(255,255,255,.5) inset;
  }
  .btn:hover::before { transform:scaleY(1); }
  .btn:active { transform:translateY(0) scale(.98); }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .btn.confirm { background:#fff; color:#0a0a0a; border-color:#fff; }
  .btn.confirm::before { background:#0a0a0a; }
  .btn.confirm:hover {
    color:#fff; border-color:#0a0a0a;
    box-shadow:0 10px 28px rgba(0,0,0,.6),
               0 0 0 1px rgba(255,255,255,.6) inset;
  }

  .status {
    min-height:18px; text-align:center; font-size:12.5px;
    letter-spacing:.08em; color:rgba(255,255,255,.6);
    transition:color .3s ease;
  }
  .status.ok    { color:#7CFFB2; }
  .status.error { color:#FF7C7C; }
  .status.info  { color:#7CB8FF; }

  .success {
    display:none; text-align:center; padding:20px;
    border-radius:16px; background:rgba(124,255,178,.08);
    border:1px solid rgba(124,255,178,.35);
    animation:rise .5s ease both;
  }
  .success.show { display:block; }
  .success h2 {
    font-size:18px; color:#7CFFB2; letter-spacing:.1em;
    margin-bottom:8px; font-weight:800;
  }
  .success p {
    font-size:12px; color:rgba(255,255,255,.65); letter-spacing:.06em;
  }

  /* Loading spinner */
  .spinner {
    display:inline-block; width:12px; height:12px;
    border:2px solid rgba(255,255,255,0.3);
    border-top-color:#fff; border-radius:50%;
    animation:spin 0.7s linear infinite;
    margin-right:6px; vertical-align:middle;
  }
  @keyframes spin { to { transform:rotate(360deg); } }

  @media (max-width:460px) {
    .menu { padding:36px 22px 32px; gap:22px; }
    .buttons { grid-template-columns:1fr; }
    .header h1 { font-size:21px; }
    #keyInput { padding:17px 16px; font-size:14px; }
  }
</style>
</head>
<body>

<div class="orb one"></div>
<div class="orb two"></div>

<main class="menu">
  <div class="header">
    <h1>Key Access</h1>
    <p>Enter your license to continue</p>
  </div>

  <div class="input-wrap">
    <input
      id="keyInput"
      type="text"
      placeholder="NHẬP KEY CỦA BẠN"
      autocomplete="off"
      spellcheck="false"
    />
  </div>

  <div class="buttons">
    <button class="btn" id="btnGet">Get Key</button>
    <button class="btn" id="btnPaste">Dán Key</button>
    <button class="btn confirm" id="btnConfirm">Xác Nhận</button>
  </div>

  <div class="status" id="status"></div>

  <div class="success" id="successBox">
    <h2>✅ XÁC THỰC THÀNH CÔNG</h2>
    <p>Key hợp lệ — bạn có thể tiếp tục.</p>
  </div>
</main>

<script>
(function () {
  "use strict";

  /* ==========================================================
     CẤU HÌNH SERVER XÁC THỰC
     ========================================================== */
  const SERVER_API_KEY = "as_nd5jpgikhoba97fbmel47cxvqtovjzsnxa01z9io6bhsoixb";

  // Endpoint xác thực — thay URL thật của bạn
  // Hỗ trợ cả 2 kiểu: GET ?key= hoặc POST JSON { key }
  const VERIFY_ENDPOINT = "https://api.example.com/verify";  // <-- ĐỔI
  const VERIFY_METHOD   = "POST";  // "GET" hoặc "POST"

  // Timeout ms
  const TIMEOUT_MS = 10000;

  // Lưu key đã xác thực
  const STORAGE_KEY = "ff_verified_key";
  const STORAGE_TIME = "ff_verified_at";

  /* ==========================================================
     DOM
     ========================================================== */
  const input      = document.getElementById("keyInput");
  const btnGet     = document.getElementById("btnGet");
  const btnPaste   = document.getElementById("btnPaste");
  const btnConfirm = document.getElementById("btnConfirm");
  const status     = document.getElementById("status");
  const successBox = document.getElementById("successBox");

  /* ==========================================================
     UTILS
     ========================================================== */
  function setStatus(msg, type) {
    status.textContent = msg;
    status.classList.remove("ok", "error", "info");
    if (type) status.classList.add(type);
  }

  function setLoading(loading) {
    if (loading) {
      btnConfirm.disabled = true;
      btnConfirm.innerHTML = '<span class="spinner"></span> ĐANG XÁC THỰC...';
    } else {
      btnConfirm.disabled = false;
      btnConfirm.textContent = "Xác Nhận";
    }
  }

  /* ==========================================================
     GỌI API XÁC THỰC
     ========================================================== */
  async function verifyWithServer(userKey) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), TIMEOUT_MS);

    try {
      let response;

      if (VERIFY_METHOD === "POST") {
        response = await fetch(VERIFY_ENDPOINT, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-API-Key": SERVER_API_KEY,
            "Authorization": "Bearer " + SERVER_API_KEY
          },
          body: JSON.stringify({
            key: userKey,
            api_key: SERVER_API_KEY,
            timestamp: Date.now()
          }),
          signal: controller.signal
        });
      } else {
        const url = VERIFY_ENDPOINT
          + "?key=" + encodeURIComponent(userKey)
          + "&api_key=" + encodeURIComponent(SERVER_API_KEY);
        response = await fetch(url, {
          method: "GET",
          headers: {
            "X-API-Key": SERVER_API_KEY
          },
          signal: controller.signal
        });
      }

      clearTimeout(timer);

      if (!response.ok) {
        throw new Error("HTTP " + response.status);
      }

      const data = await response.json();

      /* ===== PHÂN TÍCH RESPONSE =====
         Hỗ trợ nhiều dạng response:
         - { valid: true }
         - { status: "success" }
         - { success: 1 }
         - { code: 200, message: "OK" }
         - { error: false }
         - { verified: true }
      */
      const isValid =
        data.valid === true ||
        data.valid === "true" ||
        data.verified === true ||
        data.success === true ||
        data.success === 1 ||
        data.status === "success" ||
        data.status === "ok" ||
        data.status === "valid" ||
        data.error === false ||
        data.code === 200 ||
        data.code === "200";

      return {
        valid: isValid,
        message: data.message || data.msg || (isValid ? "OK" : "Invalid key"),
        expire_at: data.expire_at || data.expires_at || data.expiry || null,
        raw: data
      };

    } catch (err) {
      clearTimeout(timer);
      throw err;
    }
  }

  /* ==========================================================
     FALLBACK: kiểm tra local nếu server lỗi
     (Dùng khi test offline — bỏ đoạn này nếu không muốn)
     ========================================================== */
  const LOCAL_VALID_KEY = SERVER_API_KEY;
  function fallbackVerify(userKey) {
    return {
      valid: userKey === LOCAL_VALID_KEY,
      message: userKey === LOCAL_VALID_KEY ? "OK (offline)" : "Invalid key",
      expire_at: null,
      raw: { fallback: true }
    };
  }

  /* ==========================================================
     NÚT XÁC NHẬN
     ========================================================== */
  btnConfirm.addEventListener("click", async function () {
    const value = input.value.trim();

    if (!value) {
      setStatus("⚠ Vui lòng nhập key trước khi xác nhận.", "error");
      input.focus();
      return;
    }

    if (value.length < 8) {
      setStatus("⚠ Key quá ngắn.", "error");
      input.focus();
      return;
    }

    setStatus("⏳ Đang kết nối server...", "info");
    setLoading(true);

    try {
      const result = await verifyWithServer(value);

      if (result.valid) {
        setStatus("");
        successBox.classList.add("show");
        successBox.querySelector("p").textContent =
          result.expire_at
            ? "Hạn sử dụng: " + new Date(result.expire_at).toLocaleString("vi-VN")
            : "Key hợp lệ — bạn có thể tiếp tục.";

        input.disabled = true;
        input.style.opacity = "0.7";
        btnConfirm.disabled = true;
        btnPaste.disabled = true;

        try {
          localStorage.setItem(STORAGE_KEY, value);
          localStorage.setItem(STORAGE_TIME, Date.now().toString());
          if (result.expire_at) {
            localStorage.setItem("ff_expire_at", String(result.expire_at));
          }
        } catch (e) {}

      } else {
        setStatus("❌ KEY không hợp lệ. " + (result.message || ""), "error");
        input.focus();
        input.select();
        setLoading(false);
      }

    } catch (err) {
      console.warn("[Verify Error]", err);

      // Thử fallback local
      const fb = fallbackVerify(value);
      if (fb.valid) {
        setStatus("");
        successBox.classList.add("show");
        successBox.querySelector("p").textContent = "Key hợp lệ (kiểm tra offline)";
        input.disabled = true;
        input.style.opacity = "0.7";
        try {
          localStorage.setItem(STORAGE_KEY, value);
          localStorage.setItem(STORAGE_TIME, Date.now().toString());
        } catch (e) {}
      } else {
        setStatus("❌ Lỗi server: " + (err.message || "Không kết nối được"), "error");
        setLoading(false);
      }
    }
  });

  /* ==========================================================
     NÚT DÁN KEY
     ========================================================== */
  btnPaste.addEventListener("click", async function () {
    try {
      if (!navigator.clipboard || !navigator.clipboard.readText) {
        setStatus("⚠ Trình duyệt không hỗ trợ dán tự động.", "error");
        input.focus();
        return;
      }
      const text = await navigator.clipboard.readText();
      if (!text || !text.trim()) {
        setStatus("⚠ Clipboard đang trống.", "error");
        return;
      }
      input.value = text.trim();
      input.focus();
      input.setSelectionRange(input.value.length, input.value.length);
      setStatus("✓ Đã dán key vào ô nhập.", "ok");
    } catch (err) {
      setStatus("⚠ Không đọc được clipboard. Hãy Ctrl+V thủ công.", "error");
      input.focus();
    }
  });

  /* ==========================================================
     NÚT GET KEY
     ========================================================== */
  btnGet.addEventListener("click", function () {
    const GET_KEY_URL = "https://example.com/get-key"; // <-- đổi link
    window.open(GET_KEY_URL, "_blank", "noopener");
    setStatus("🔗 Đang mở trang lấy key...", "info");
  });

  /* ==========================================================
     ENTER ĐỂ XÁC NHẬN
     ========================================================== */
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      e.preventDefault();
      btnConfirm.click();
    }
  });

  /* Xoá status khi gõ */
  input.addEventListener("input", function () {
    if (status.textContent) {
      status.textContent = "";
      status.classList.remove("ok", "error", "info");
    }
  });

  /* ==========================================================
     AUTO CHECK: nếu đã xác thực trước đó
     ========================================================== */
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    const savedAt = parseInt(localStorage.getItem(STORAGE_TIME) || "0", 10);
    const expireAt = parseInt(localStorage.getItem("ff_expire_at") || "0", 10);

    if (saved) {
      // Kiểm tra hạn
      if (expireAt && Date.now() > expireAt) {
        localStorage.removeItem(STORAGE_KEY);
        localStorage.removeItem(STORAGE_TIME);
        localStorage.removeItem("ff_expire_at");
        setStatus("⚠ Key trước đã hết hạn, vui lòng nhập lại.", "error");
      } else {
        input.value = saved;
        // Chỉ auto hiển thị trạng thái, không tự xác thực lại
        setStatus("✓ Key đã được xác thực trước đó.", "ok");
        // Nếu còn hạn → có thể tự show success
        if (savedAt && (!expireAt || Date.now() < expireAt)) {
          successBox.classList.add("show");
          successBox.querySelector("p").textContent =
            expireAt
              ? "Hạn: " + new Date(expireAt).toLocaleString("vi-VN")
              : "Key đã xác thực trước đó.";
          input.disabled = true;
          input.style.opacity = "0.7";
          btnConfirm.disabled = true;
          btnPaste.disabled = true;
        }
      }
    }
  } catch (e) { /* ignore */ }

})();
</script>
</body>
</html>
