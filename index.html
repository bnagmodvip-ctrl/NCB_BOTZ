<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NHẬP KEY XÁC MINH</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box;
      font-family:'Segoe UI','Inter',system-ui,sans-serif; }
  html, body { height:100%; overflow:hidden; }
  body {
    display:flex; align-items:center; justify-content:center;
    background:#000;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,0.08), transparent 45%),
      radial-gradient(circle at 80% 70%, rgba(255,255,255,0.06), transparent 45%);
    position:relative;
  }
  body::before {
    content:""; position:fixed; inset:0;
    background:radial-gradient(circle at 50% 50%, transparent 0%, rgba(0,0,0,0.65) 100%);
    pointer-events:none; z-index:0;
  }
  .orb {
    position:fixed; border-radius:50%; filter:blur(80px); opacity:.35;
    pointer-events:none; z-index:0; animation:float 12s ease-in-out infinite;
  }
  .orb.one { width:420px; height:420px; background:#fff; top:-120px; left:-120px; }
  .orb.two { width:380px; height:380px; background:#888; bottom:-140px; right:-100px; animation-delay:-4s; }
  @keyframes float {
    0%,100% { transform:translate(0,0) scale(1); }
    50%     { transform:translate(30px,-25px) scale(1.08); }
  }

  .menu {
    position:relative; z-index:2;
    width:min(520px, 92vw);
    padding:48px 40px 44px;
    border-radius:24px;
    background:rgba(12,12,12,0.72);
    backdrop-filter:blur(22px) saturate(160%);
    -webkit-backdrop-filter:blur(22px) saturate(160%);
    border:1px solid rgba(255,255,255,0.10);
    box-shadow:0 30px 80px rgba(0,0,0,0.75), inset 0 1px 0 rgba(255,255,255,0.06);
    display:flex; flex-direction:column; gap:28px;
    animation:rise .9s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes rise {
    from { opacity:0; transform:translateY(28px) scale(.98); }
    to   { opacity:1; transform:translateY(0) scale(1); }
  }

  .header { text-align:center; display:flex; flex-direction:column; gap:8px; }
  .header h1 {
    font-size:24px; font-weight:800; letter-spacing:.12em; text-transform:uppercase;
    background:linear-gradient(90deg,#fff 0%,#b8b8b8 50%,#fff 100%);
    background-size:200% auto;
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:shine 4s linear infinite;
  }
  @keyframes shine { to { background-position:200% center; } }
  .header p {
    font-size:12.5px; letter-spacing:.22em;
    color:rgba(255,255,255,0.45); text-transform:uppercase;
  }

  .input-wrap {
    position:relative; border-radius:16px; padding:2px;
    background:conic-gradient(from var(--angle,0deg),#fff,#6b6b6b,#fff,#6b6b6b,#fff);
    animation:rotate-border 6s linear infinite;
    isolation:isolate;
  }
  @property --angle { syntax:"<angle>"; initial-value:0deg; inherits:false; }
  @keyframes rotate-border { to { --angle:360deg; } }
  .input-wrap::after {
    content:""; position:absolute; inset:-6px; border-radius:20px;
    background:inherit; filter:blur(18px); opacity:.55; z-index:-1;
    animation:rotate-border 6s linear infinite;
  }

  #keyInput {
    width:100%; padding:20px 22px; border-radius:14px; border:none; outline:none;
    background:#fff; color:#0a0a0a; font-size:15px; font-weight:600;
    letter-spacing:.06em; text-align:center; caret-color:#000;
    box-shadow:inset 0 2px 10px rgba(0,0,0,.08), inset 0 -1px 0 rgba(0,0,0,.04);
    transition:transform .25s ease, box-shadow .25s ease;
    position:relative; z-index:1;
  }
  #keyInput::placeholder { color:rgba(0,0,0,.28); letter-spacing:.14em; font-weight:500; }
  #keyInput:focus {
    transform:translateY(-1px);
    box-shadow:inset 0 2px 10px rgba(0,0,0,.08),
               0 0 0 4px rgba(255,255,255,.15),
               0 0 40px rgba(255,255,255,.20);
  }

  .buttons {
    display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; margin-top:4px;
  }
  .btn {
    position:relative; padding:15px 10px; border-radius:12px;
    background:transparent; border:1.5px solid rgba(255,255,255,0.28);
    color:#fff; font-size:13px; font-weight:700; letter-spacing:.10em;
    text-transform:uppercase; cursor:pointer; overflow:hidden;
    transition:color .35s ease, border-color .35s ease,
               transform .25s ease, box-shadow .35s ease;
    font-family:inherit;
  }
  .btn::before {
    content:""; position:absolute; inset:0; background:#fff;
    transform:scaleY(0); transform-origin:bottom;
    transition:transform .4s cubic-bezier(.65,0,.35,1);
    z-index:-1;
  }
  .btn:hover {
    color:#0a0a0a; border-color:#fff; transform:translateY(-2px);
    box-shadow:0 10px 28px rgba(255,255,255,.18),
               0 0 0 1px rgba(255,255,255,.5) inset;
  }
  .btn:hover::before { transform:scaleY(1); }
  .btn:active { transform:translateY(0) scale(.98); }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .btn.confirm { background:#fff; color:#0a0a0a; border-color:#fff; }
  .btn.confirm::before { background:#0a0a0a; }
  .btn.confirm:hover {
    color:#fff; border-color:#0a0a0a;
    box-shadow:0 10px 28px rgba(0,0,0,.6),
               0 0 0 1px rgba(255,255,255,.6) inset;
  }

  .status {
    min-height:18px; text-align:center; font-size:12.5px;
    letter-spacing:.08em; color:rgba(255,255,255,.6);
    transition:color .3s ease;
  }
  .status.ok    { color:#7CFFB2; }
  .status.error { color:#FF7C7C; }

  .success {
    display:none; text-align:center; padding:20px;
    border-radius:16px; background:rgba(124,255,178,.08);
    border:1px solid rgba(124,255,178,.35);
    animation:rise .5s ease both;
  }
  .success.show { display:block; }
  .success h2 {
    font-size:18px; color:#7CFFB2; letter-spacing:.1em;
    margin-bottom:8px; font-weight:800;
  }
  .success p {
    font-size:12px; color:rgba(255,255,255,.65); letter-spacing:.06em;
  }

  .gallery-screen {
    position:fixed; inset:0;
    background:linear-gradient(135deg,#ffe4ec 0%,#fff5f8 35%,#ffd6e4 100%);
    z-index:50;
    display:none;
    overflow-y:auto;
    padding:40px 20px 120px;
    animation:fadeIn .6s ease;
  }
  .gallery-screen.show { display:block; }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }

  .gallery-screen::before {
    content:"";
    position:fixed; inset:0;
    background:
      radial-gradient(circle at 15% 20%, rgba(255,105,180,0.18), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(255,182,193,0.25), transparent 45%);
    pointer-events:none;
  }

  .gallery-header {
    position:relative; z-index:2;
    max-width:1100px; margin:0 auto 40px;
    text-align:center;
  }
  .gallery-header h1 {
    font-size:34px; font-weight:900;
    letter-spacing:.20em;
    color:#d6336c;
    text-transform:uppercase;
    text-shadow:0 2px 20px rgba(214,51,108,0.15);
    margin-bottom:8px;
  }
  .gallery-header p {
    font-size:12px; letter-spacing:.30em;
    color:#b8477a;
    text-transform:uppercase;
  }
  .gallery-header::after {
    content:"";
    display:block; width:60px; height:2px;
    background:linear-gradient(90deg,transparent,#ff69b4,transparent);
    margin:16px auto 0;
  }

  .movie-grid {
    position:relative; z-index:2;
    max-width:1100px; margin:0 auto;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(200px, 1fr));
    gap:28px;
  }

  .movie-card {
    background:#fff;
    border-radius:16px;
    overflow:hidden;
    cursor:pointer;
    position:relative;
    box-shadow:0 8px 24px rgba(214,51,108,0.10), 0 2px 6px rgba(0,0,0,0.04);
    border:2px solid #ffe4ec;
    transition:transform .35s cubic-bezier(.16,1,.3,1),
               box-shadow .35s ease, border-color .35s ease;
    animation:cardIn .6s ease both;
  }
  @keyframes cardIn {
    from { opacity:0; transform:translateY(20px); }
    to   { opacity:1; transform:translateY(0); }
  }
  .movie-card:nth-child(1) { animation-delay:0.05s; }
  .movie-card:nth-child(2) { animation-delay:0.10s; }
  .movie-card:nth-child(3) { animation-delay:0.15s; }
  .movie-card:nth-child(4) { animation-delay:0.20s; }
  .movie-card:nth-child(5) { animation-delay:0.25s; }
  .movie-card:nth-child(6) { animation-delay:0.30s; }
  .movie-card:nth-child(7) { animation-delay:0.35s; }
  .movie-card:nth-child(8) { animation-delay:0.40s; }
  .movie-card:nth-child(9) { animation-delay:0.45s; }

  .movie-card:hover {
    transform:translateY(-8px) scale(1.02);
    box-shadow:0 20px 40px rgba(214,51,108,0.25);
    border-color:#ff69b4;
  }
  .movie-card:hover .movie-poster::after { opacity:1; }
  .movie-card:hover .play-icon {
    transform:scale(1) rotate(0deg);
    opacity:1;
  }

  .movie-poster {
    position:relative;
    width:100%;
    aspect-ratio:2/3;
    background:linear-gradient(135deg,#ffd6e4,#ffe4ec);
    overflow:hidden;
  }
  .movie-poster::after {
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(180deg, transparent 40%, rgba(214,51,108,0.6) 100%);
    opacity:0;
    transition:opacity .3s ease;
  }
  .movie-poster img {
    width:100%; height:100%;
    object-fit:cover;
    display:block;
    transition:transform .5s ease;
  }
  .movie-card:hover .movie-poster img { transform:scale(1.1); }

  .play-icon {
    position:absolute; top:50%; left:50%;
    width:56px; height:56px;
    margin:-28px 0 0 -28px;
    background:rgba(255,255,255,0.95);
    border-radius:50%;
    display:grid; place-items:center;
    transform:scale(0.5) rotate(-90deg);
    opacity:0;
    transition:transform .35s cubic-bezier(.16,1,.3,1), opacity .3s;
    z-index:3;
    box-shadow:0 6px 20px rgba(214,51,108,0.4);
  }
  .play-icon svg { width:22px; height:22px; fill:#d6336c; margin-left:3px; }

  .movie-info { padding:16px 18px 18px; }
  .movie-name {
    font-size:15px; font-weight:800;
    color:#2d1a24;
    letter-spacing:.02em;
    margin-bottom:6px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .movie-meta {
    display:flex; align-items:center; gap:8px;
    font-size:11px; color:#b8477a;
    letter-spacing:.08em; text-transform:uppercase;
  }
  .movie-meta .dot {
    width:3px; height:3px; border-radius:50%;
    background:#ffb6c1;
  }
  .movie-meta .rating {
    display:flex; align-items:center; gap:2px;
    color:#ffaa00; font-weight:700;
  }
  .movie-meta .rating svg { width:11px; height:11px; fill:#ffaa00; }

  .player-screen {
    position:fixed; inset:0;
    background:rgba(0,0,0,0.96);
    z-index:100;
    display:none;
    align-items:center;
    justify-content:center;
    animation:fadeIn .4s ease;
  }
  .player-screen.show { display:flex; }

  .player-box {
    position:relative;
    width:92vw;
    max-width:1200px;
    aspect-ratio:16/9;
    background:#000;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 40px 120px rgba(255,105,180,0.25);
  }

  .player-box iframe {
    width:100%; height:100%;
    display:block;
    border:none;
    background:#000;
  }

  .player-title {
    position:absolute; top:0; left:0; right:0;
    padding:24px 90px 24px 80px;
    background:linear-gradient(180deg, rgba(0,0,0,0.85), transparent);
    color:#fff;
    font-size:18px; font-weight:800;
    letter-spacing:.05em;
    pointer-events:none;
    z-index:5;
    opacity:0;
    transition:opacity .3s ease;
  }
  .player-title.show { opacity:1; }

  .back-btn {
    position:absolute; top:18px; left:18px;
    width:44px; height:44px;
    border-radius:50%;
    background:rgba(255,255,255,0.12);
    border:1.5px solid rgba(255,255,255,0.3);
    color:#fff;
    display:grid; place-items:center;
    cursor:pointer;
    z-index:10;
    backdrop-filter:blur(10px);
    transition:all .25s ease;
  }
  .back-btn:hover {
    background:#ff69b4;
    border-color:#ff69b4;
    transform:scale(1.08);
  }
  .back-btn svg {
    width:20px; height:20px; stroke:#fff; fill:none; stroke-width:2.5;
    stroke-linecap:round; stroke-linejoin:round;
  }

  .bottom-nav {
    position:fixed;
    bottom:0; left:0; right:0;
    height:70px;
    background:rgba(255,255,255,0.92);
    backdrop-filter:blur(24px) saturate(180%);
    -webkit-backdrop-filter:blur(24px) saturate(180%);
    border-top:1px solid rgba(255,105,180,0.25);
    display:none;
    z-index:60;
    box-shadow:0 -10px 30px rgba(214,51,108,0.08);
    padding-bottom:env(safe-area-inset-bottom, 0);
  }
  .bottom-nav.show { display:flex; }

  .bottom-nav-inner {
    max-width:1100px;
    margin:0 auto;
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:60px;
    padding:0 20px;
  }

  .nav-btn {
    background:transparent;
    border:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    cursor:pointer;
    padding:10px 22px;
    border-radius:14px;
    color:#b8477a;
    transition:all .25s ease;
    font-family:inherit;
    position:relative;
  }
  .nav-btn i { font-size:20px; transition:transform .25s ease; }
  .nav-btn span {
    font-size:10.5px;
    font-weight:700;
    letter-spacing:.10em;
    text-transform:uppercase;
  }
  .nav-btn:hover {
    color:#d6336c;
    background:rgba(255,105,180,0.10);
  }
  .nav-btn:hover i { transform:translateY(-2px) scale(1.1); }
  .nav-btn.active { color:#d6336c; }
  .nav-btn.active::after {
    content:"";
    position:absolute;
    bottom:2px;
    left:50%;
    transform:translateX(-50%);
    width:20px;
    height:3px;
    background:linear-gradient(90deg,#ff69b4,#d6336c);
    border-radius:2px;
  }

  .profile-overlay {
    position:fixed; inset:0;
    background:rgba(0,0,0,0.55);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    z-index:200;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    animation:fadeIn .3s ease;
  }
  .profile-overlay.show { display:flex; }

  .profile-box {
    width:100%;
    max-width:420px;
    background:linear-gradient(180deg,#fff 0%,#fff5f8 100%);
    border-radius:24px;
    padding:36px 30px 28px;
    box-shadow:0 30px 80px rgba(214,51,108,0.35);
    border:2px solid #ffe4ec;
    animation:profileIn .45s cubic-bezier(.16,1,.3,1);
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  @keyframes profileIn {
    from { opacity:0; transform:scale(.9) translateY(20px); }
    to   { opacity:1; transform:scale(1) translateY(0); }
  }

  .profile-box::before {
    content:"";
    position:absolute;
    top:-80px; right:-80px;
    width:200px; height:200px;
    background:radial-gradient(circle, rgba(255,105,180,0.25), transparent 70%);
    border-radius:50%;
  }
  .profile-box::after {
    content:"";
    position:absolute;
    bottom:-80px; left:-80px;
    width:200px; height:200px;
    background:radial-gradient(circle, rgba(255,182,193,0.25), transparent 70%);
    border-radius:50%;
  }

  .profile-icon {
    width:80px; height:80px;
    margin:0 auto 18px;
    background:linear-gradient(135deg,#ff69b4,#d6336c);
    border-radius:50%;
    display:grid; place-items:center;
    box-shadow:0 10px 30px rgba(214,51,108,0.35);
    position:relative;
    z-index:1;
  }
  .profile-icon i { font-size:34px; color:#fff; }

  .profile-title {
    font-size:13px;
    letter-spacing:.20em;
    color:#b8477a;
    text-transform:uppercase;
    font-weight:700;
    margin-bottom:8px;
    position:relative;
    z-index:1;
  }

  .profile-key {
    font-size:15px;
    font-weight:800;
    color:#2d1a24;
    font-family:'Courier New',monospace;
    letter-spacing:.02em;
    padding:14px 16px;
    background:#ffe4ec;
    border:1.5px solid #ffb6c1;
    border-radius:12px;
    margin-bottom:14px;
    word-break:break-all;
    position:relative;
    z-index:1;
  }

  .profile-vn-time {
    font-size:11px;
    color:#b8477a;
    font-family:'Courier New',monospace;
    letter-spacing:.05em;
    margin-bottom:20px;
    position:relative;
    z-index:1;
  }

  .profile-divider {
    height:1px;
    background:linear-gradient(90deg,transparent,#ffb6c1,transparent);
    margin:20px 0;
    position:relative;
    z-index:1;
  }

  .countdown-label {
    font-size:11px;
    letter-spacing:.20em;
    color:#b8477a;
    text-transform:uppercase;
    font-weight:700;
    margin-bottom:10px;
    position:relative;
    z-index:1;
  }

  .countdown-timer {
    display:flex;
    justify-content:center;
    gap:10px;
    margin-bottom:22px;
    position:relative;
    z-index:1;
  }

  .countdown-block {
    background:linear-gradient(135deg,#fff,#ffe4ec);
    border:2px solid #ffb6c1;
    border-radius:12px;
    padding:10px 14px;
    min-width:64px;
    box-shadow:0 4px 12px rgba(214,51,108,0.10);
  }
  .countdown-num {
    font-size:24px;
    font-weight:900;
    color:#d6336c;
    font-family:'Courier New',monospace;
    line-height:1;
    margin-bottom:2px;
  }
  .countdown-unit {
    font-size:9.5px;
    letter-spacing:.14em;
    color:#b8477a;
    text-transform:uppercase;
    font-weight:700;
  }

  .logout-btn {
    width:100%;
    padding:15px;
    border-radius:14px;
    border:2px solid #ffb6c1;
    background:#fff;
    color:#d6336c;
    font-size:13px;
    font-weight:800;
    letter-spacing:.12em;
    text-transform:uppercase;
    cursor:pointer;
    transition:all .25s ease;
    font-family:inherit;
    position:relative;
    z-index:1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  .logout-btn:hover {
    background:linear-gradient(135deg,#d6336c,#ff69b4);
    color:#fff;
    border-color:#d6336c;
    transform:translateY(-2px);
    box-shadow:0 10px 25px rgba(214,51,108,0.4);
  }
  .logout-btn:active { transform:translateY(0) scale(.98); }

  .close-profile {
    position:absolute;
    top:14px; right:14px;
    width:36px; height:36px;
    border-radius:50%;
    background:rgba(255,255,255,0.6);
    border:1.5px solid #ffb6c1;
    color:#d6336c;
    cursor:pointer;
    display:grid; place-items:center;
    z-index:10;
    transition:all .2s ease;
  }
  .close-profile:hover {
    background:#d6336c;
    color:#fff;
    transform:rotate(90deg);
  }
  .close-profile i { font-size:16px; }

  @media (max-width:460px) {
    .menu { padding:36px 22px 32px; gap:22px; }
    .buttons { grid-template-columns:1fr; }
    .header h1 { font-size:19px; }
    #keyInput { padding:17px 16px; font-size:14px; }
    .gallery-header h1 { font-size:24px; }
    .movie-grid { grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:16px; }
    .player-box { width:96vw; border-radius:10px; }
    .back-btn { width:38px; height:38px; top:12px; left:12px; }
    .bottom-nav-inner { gap:30px; }
    .nav-btn { padding:8px 16px; }
    .countdown-block { min-width:54px; padding:8px 10px; }
    .countdown-num { font-size:20px; }
  }
</style>
</head>
<body>

<div class="orb one"></div>
<div class="orb two"></div>

<main class="menu" id="keyScreen">
  <div class="header">
    <h1>NHẬP KEY XÁC MINH</h1>
    <p>NHẬP KEY ĐỂ XÁC THỰC</p>
  </div>

  <div class="input-wrap">
    <input id="keyInput" type="text" placeholder="NHẬP KEY CỦA BẠN" autocomplete="off" spellcheck="false" />
  </div>

  <div class="buttons">
    <button class="btn" id="btnGet">Get Key</button>
    <button class="btn" id="btnPaste">Dán Key</button>
    <button class="btn confirm" id="btnConfirm">Xác Nhận</button>
  </div>

  <div class="status" id="status"></div>

  <div class="success" id="successBox">
    <h2>✅ XÁC THỰC THÀNH CÔNG</h2>
    <p>Key hợp lệ — đang mở thư viện phim...</p>
  </div>
</main>

<div class="gallery-screen" id="galleryScreen">
  <div class="gallery-header">
    <h1>Movie Library</h1>
    <p>Chọn phim để xem</p>
  </div>
  <div class="movie-grid" id="movieGrid"></div>
</div>

<div class="player-screen" id="playerScreen">
  <div class="player-box">
    <button class="back-btn" id="backBtn" title="Quay lại">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="player-title" id="playerTitle"></div>
    <iframe id="movieFrame" allowfullscreen allow="autoplay; fullscreen"></iframe>
  </div>
</div>

<nav class="bottom-nav" id="bottomNav">
  <div class="bottom-nav-inner">
    <button class="nav-btn active" id="navHome" data-tab="home">
      <i class="fa-solid fa-house"></i>
      <span>Trang chủ</span>
    </button>
    <button class="nav-btn" id="navProfile" data-tab="profile">
      <i class="fa-solid fa-user"></i>
      <span>Hồ sơ</span>
    </button>
  </div>
</nav>

<div class="profile-overlay" id="profileOverlay">
  <div class="profile-box">
    <button class="close-profile" id="closeProfile">
      <i class="fa-solid fa-xmark"></i>
    </button>
    <div class="profile-icon"><i class="fa-solid fa-key"></i></div>
    <div class="profile-title">License Key</div>
    <div class="profile-key" id="profileKey">—</div>
    <div class="profile-vn-time" id="profileVnTime">—</div>
    <div class="profile-divider"></div>
    <div class="countdown-label">Thời Gian Key</div>
    <div class="countdown-timer">
      <div class="countdown-block">
        <div class="countdown-num" id="cdDay">00</div>
        <div class="countdown-unit">Ngày</div>
      </div>
      <div class="countdown-block">
        <div class="countdown-num" id="cdHour">00</div>
        <div class="countdown-unit">Giờ</div>
      </div>
      <div class="countdown-block">
        <div class="countdown-num" id="cdMin">00</div>
        <div class="countdown-unit">Phút</div>
      </div>
      <div class="countdown-block">
        <div class="countdown-num" id="cdSec">00</div>
        <div class="countdown-unit">Giây</div>
      </div>
    </div>
    <button class="logout-btn" id="logoutBtn">
      <i class="fa-solid fa-right-from-bracket"></i>
      Đăng Xuất Key
    </button>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ============================================================
     DANH SÁCH KEY HỢP LỆ — BẠN TỰ THÊM/SỬA/XÓA TẠI ĐÂY
     ============================================================ */
  const VALID_KEYS = [
    "NCB_XNHAU_291030_27",
    "NCB_XNHAU_03YU0_2P",
    "NCB_XNHAU_291030_27LJA",
    "NCB_XNHAU_291030_27user",
    "KEY_MAU_1",
    "KEY_MAU_2"
  ];

  /* Thời hạn key: 13 tiếng */
  const KEY_DURATION_MS = 13 * 60 * 60 * 1000;

  /* ============================================================
     DANH SÁCH PHIM
     ============================================================ */
  const MOVIES = [
    {
      name: "EM HỌC SINH (1)",
      year: "2024",
      rating: "9.0",
      poster: "https://picsum.photos/seed/emhocsinh1/400/600",
      embed: "https://xnhau.pink/embed/254778"
    },
    {
      name: "cal sex",
      year: "2024",
      rating: "8.9",
      poster: "https://picsum.photos/seed/calsex/400/600",
      embed: "https://xnhau.pink/embed/257961"
    },
    {
      name: "EM TÔI ĐÓ (1)",
      year: "2024",
      rating: "9.0",
      poster: "https://picsum.photos/seed/emtôidó1/400/600",
      embed: "https://xnhau.pink/embed/252524"
    },
    {
      name: "EM TÔI (1)",
      year: "2024",
      rating: "9.0",
      poster: "https://picsum.photos/seed/emtôi1/400/600",
      embed: "https://xnhau.pink/embed/288097"
    }
  ];

  /* ============================================================
     DOM
     ============================================================ */
  const keyScreen      = document.getElementById("keyScreen");
  const galleryScreen  = document.getElementById("galleryScreen");
  const playerScreen   = document.getElementById("playerScreen");
  const input          = document.getElementById("keyInput");
  const btnGet         = document.getElementById("btnGet");
  const btnPaste       = document.getElementById("btnPaste");
  const btnConfirm     = document.getElementById("btnConfirm");
  const status         = document.getElementById("status");
  const successBox     = document.getElementById("successBox");
  const movieGrid      = document.getElementById("movieGrid");
  const movieFrame     = document.getElementById("movieFrame");
  const playerTitle    = document.getElementById("playerTitle");
  const backBtn        = document.getElementById("backBtn");

  const bottomNav      = document.getElementById("bottomNav");
  const navHome        = document.getElementById("navHome");
  const navProfile     = document.getElementById("navProfile");
  const profileOverlay = document.getElementById("profileOverlay");
  const closeProfile   = document.getElementById("closeProfile");
  const profileKey     = document.getElementById("profileKey");
  const profileVnTime  = document.getElementById("profileVnTime");
  const logoutBtn      = document.getElementById("logoutBtn");
  const cdDay          = document.getElementById("cdDay");
  const cdHour         = document.getElementById("cdHour");
  const cdMin          = document.getElementById("cdMin");
  const cdSec          = document.getElementById("cdSec");

  let countdownInterval = null;

  function setStatus(msg, type) {
    status.textContent = msg;
    status.classList.remove("ok", "error");
    if (type) status.classList.add(type);
  }

  function formatVNTime(ts) {
    const d = new Date(ts);
    const vn = new Date(d.getTime() + (d.getTimezoneOffset() * 60000) + (7 * 3600000));
    const pad = n => String(n).padStart(2, "0");
    return pad(vn.getDate()) + "/" + pad(vn.getMonth() + 1) + "/" + vn.getFullYear()
      + " " + pad(vn.getHours()) + ":" + pad(vn.getMinutes()) + ":" + pad(vn.getSeconds());
  }

  function saveActivation(key, activatedAt) {
    try {
      const data = JSON.parse(localStorage.getItem("ff_keys_db") || "{}");
      data[key] = activatedAt;
      localStorage.setItem("ff_keys_db", JSON.stringify(data));
      localStorage.setItem("ff_current_key", key);
    } catch (e) {}
  }

  function getActivation(key) {
    try {
      const data = JSON.parse(localStorage.getItem("ff_keys_db") || "{}");
      return data[key] || 0;
    } catch (e) { return 0; }
  }

  function getCurrentKey() {
    try { return localStorage.getItem("ff_current_key") || ""; }
    catch (e) { return ""; }
  }

  function buildGallery() {
    movieGrid.innerHTML = "";
    MOVIES.forEach((movie, idx) => {
      const card = document.createElement("div");
      card.className = "movie-card";
      card.style.animationDelay = (idx * 0.05) + "s";
      card.innerHTML = `
        <div class="movie-poster">
          <img src="${movie.poster}" alt="${movie.name}" loading="lazy"
               onerror="this.style.display='none'">
          <div class="play-icon">
            <svg viewBox="0 0 24 24"><polygon points="6,4 20,12 6,20"/></svg>
          </div>
        </div>
        <div class="movie-info">
          <div class="movie-name">${movie.name}</div>
          <div class="movie-meta">
            <span>${movie.year}</span>
            <span class="dot"></span>
            <span class="rating">
              <svg viewBox="0 0 24 24"><polygon points="12,2 15,9 22,9 17,14 19,21 12,17 5,21 7,14 2,9 9,9"/></svg>
              ${movie.rating}
            </span>
          </div>
        </div>
      `;
      card.addEventListener("click", () => openPlayer(movie));
      movieGrid.appendChild(card);
    });
  }

  let hideTitleTimer = null;

  function openPlayer(movie) {
    playerTitle.textContent = movie.name;
    movieFrame.src = movie.embed;

    galleryScreen.classList.remove("show");
    playerScreen.classList.add("show");
    bottomNav.classList.remove("show");
    playerTitle.classList.add("show");

    clearTimeout(hideTitleTimer);
    hideTitleTimer = setTimeout(() => {
      playerTitle.classList.remove("show");
    }, 2500);
  }

  backBtn.addEventListener("click", () => {
    movieFrame.src = "about:blank";
    playerScreen.classList.remove("show");
    galleryScreen.classList.add("show");
    bottomNav.classList.add("show");
  });

  /* ============================================================
     XÁC THỰC KEY — CHỈ LOCAL
     ============================================================ */
  btnConfirm.addEventListener("click", () => {
    const value = input.value.trim();

    if (!value) {
      setStatus("Vui lòng nhập key trước khi xác nhận.", "error");
      input.focus();
      return;
    }

    setStatus("Đang xác thực...", "ok");

    setTimeout(() => {
      if (!VALID_KEYS.includes(value)) {
        setStatus("❌ KEY không hợp lệ. Vui lòng kiểm tra lại.", "error");
        input.focus();
        input.select();
        return;
      }

      const existing = getActivation(value);
      const now = Date.now();

      if (existing && (now - existing) >= KEY_DURATION_MS) {
        setStatus("❌ Key đã hết hạn (quá 13 tiếng từ lúc kích hoạt).", "error");
        input.focus();
        input.select();
        return;
      }

      if (!existing) {
        saveActivation(value, now);
      } else {
        saveActivation(value, existing);
      }

      setStatus("");
      successBox.classList.add("show");
      btnConfirm.disabled = true;
      input.disabled = true;
      input.style.opacity = "0.7";

      setTimeout(() => {
        showGallery();
      }, 900);

    }, 600);
  });

  function showGallery() {
    keyScreen.style.transition = "opacity .5s ease, transform .5s ease";
    keyScreen.style.opacity = "0";
    keyScreen.style.transform = "scale(0.95)";
    setTimeout(() => {
      keyScreen.style.display = "none";
      galleryScreen.classList.add("show");
      bottomNav.classList.add("show");
      buildGallery();
      navHome.classList.add("active");
      navProfile.classList.remove("active");
    }, 500);
  }

  function isKeyStillValid(key) {
    const activatedAt = getActivation(key);
    if (!activatedAt) return false;
    return (Date.now() - activatedAt) < KEY_DURATION_MS;
  }

  btnPaste.addEventListener("click", async () => {
    try {
      if (!navigator.clipboard || !navigator.clipboard.readText) {
        setStatus("Trình duyệt không hỗ trợ dán tự động.", "error");
        input.focus();
        return;
      }
      const text = await navigator.clipboard.readText();
      if (!text || !text.trim()) {
        setStatus("Clipboard đang trống.", "error");
        return;
      }
      input.value = text.trim();
      input.focus();
      setStatus("Đã dán key vào ô nhập.", "ok");
    } catch (err) {
      setStatus("Không đọc được clipboard. Hãy Ctrl+V thủ công.", "error");
      input.focus();
    }
  });

  btnGet.addEventListener("click", () => {
    window.open("https://example.com/get-key", "_blank", "noopener");
    setStatus("Đang mở trang lấy key...", "ok");
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); btnConfirm.click(); }
  });

  input.addEventListener("input", () => {
    if (status.textContent) {
      status.textContent = "";
      status.classList.remove("ok", "error");
    }
  });

  function setActiveNav(tab) {
    navHome.classList.toggle("active", tab === "home");
    navProfile.classList.toggle("active", tab === "profile");
  }

  navHome.addEventListener("click", () => {
    profileOverlay.classList.remove("show");
    setActiveNav("home");
  });

  navProfile.addEventListener("click", () => {
    setActiveNav("profile");
    openProfile();
  });

  closeProfile.addEventListener("click", () => {
    profileOverlay.classList.remove("show");
    setActiveNav("home");
  });

  profileOverlay.addEventListener("click", (e) => {
    if (e.target === profileOverlay) {
      profileOverlay.classList.remove("show");
      setActiveNav("home");
    }
  });

  function openProfile() {
    const key = getCurrentKey();
    const activatedAt = getActivation(key);

    profileKey.textContent = key || "—";

    if (activatedAt) {
      profileVnTime.textContent = "Kích hoạt: " + formatVNTime(activatedAt)
        + " · Hết hạn: " + formatVNTime(activatedAt + KEY_DURATION_MS);
    } else {
      profileVnTime.textContent = "Chưa kích hoạt";
    }

    profileOverlay.classList.add("show");
    startCountdown(activatedAt + KEY_DURATION_MS);
  }

  function startCountdown(expire) {
    if (countdownInterval) clearInterval(countdownInterval);

    function tick() {
      let remain = expire - Date.now();
      if (remain < 0) remain = 0;

      const d = Math.floor(remain / 86400000);
      const h = Math.floor((remain % 86400000) / 3600000);
      const m = Math.floor((remain % 3600000) / 60000);
      const s = Math.floor((remain % 60000) / 1000);

      cdDay.textContent  = String(d).padStart(2, "0");
      cdHour.textContent = String(h).padStart(2, "0");
      cdMin.textContent  = String(m).padStart(2, "0");
      cdSec.textContent  = String(s).padStart(2, "0");

      if (remain <= 0) {
        clearInterval(countdownInterval);
        countdownInterval = null;
      }
    }

    tick();
    countdownInterval = setInterval(tick, 1000);
  }

  logoutBtn.addEventListener("click", () => {
    if (!confirm("Bạn có chắc muốn đăng xuất key?")) return;

    try { localStorage.removeItem("ff_current_key"); } catch (e) {}

    if (countdownInterval) {
      clearInterval(countdownInterval);
      countdownInterval = null;
    }

    profileOverlay.classList.remove("show");
    bottomNav.classList.remove("show");
    galleryScreen.classList.remove("show");
    playerScreen.classList.remove("show");
    movieFrame.src = "about:blank";

    keyScreen.style.display = "flex";
    keyScreen.style.opacity = "1";
    keyScreen.style.transform = "scale(1)";
    input.value = "";
    input.disabled = false;
    input.style.opacity = "1";
    btnConfirm.disabled = false;
    btnPaste.disabled = false;
    successBox.classList.remove("show");
    setStatus("Đã đăng xuất key. Vui lòng nhập lại.", "ok");
  });

  try {
    const currentKey = getCurrentKey();
    if (currentKey && VALID_KEYS.includes(currentKey)) {
      if (isKeyStillValid(currentKey)) {
        input.value = currentKey;
        setStatus("Key đang hoạt động · tự động đăng nhập", "ok");
        successBox.classList.add("show");
        btnConfirm.disabled = true;
        input.disabled = true;
        input.style.opacity = "0.7";
        setTimeout(() => showGallery(), 900);
      } else {
        localStorage.removeItem("ff_current_key");
        setStatus("Key trước đã hết hạn 13 tiếng. Vui lòng dùng key mới.", "error");
      }
    }
  } catch (e) {}

})();
</script>
</body>
</html>
