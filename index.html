<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NHẬP KEY XÁC MINH</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box;
      font-family:'Segoe UI','Inter',system-ui,sans-serif; }
  html, body { height:100%; overflow:hidden; }
  body {
    display:flex; align-items:center; justify-content:center;
    background:#000;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,0.08), transparent 45%),
      radial-gradient(circle at 80% 70%, rgba(255,255,255,0.06), transparent 45%);
    position:relative;
  }
  body::before {
    content:""; position:fixed; inset:0;
    background:radial-gradient(circle at 50% 50%, transparent 0%, rgba(0,0,0,0.65) 100%);
    pointer-events:none; z-index:0;
  }
  .orb {
    position:fixed; border-radius:50%; filter:blur(80px); opacity:.35;
    pointer-events:none; z-index:0; animation:float 12s ease-in-out infinite;
  }
  .orb.one { width:420px; height:420px; background:#fff; top:-120px; left:-120px; }
  .orb.two { width:380px; height:380px; background:#888; bottom:-140px; right:-100px; animation-delay:-4s; }
  @keyframes float {
    0%,100% { transform:translate(0,0) scale(1); }
    50%     { transform:translate(30px,-25px) scale(1.08); }
  }

  .menu {
    position:relative; z-index:2;
    width:min(520px, 92vw);
    padding:48px 40px 44px;
    border-radius:24px;
    background:rgba(12,12,12,0.72);
    backdrop-filter:blur(22px) saturate(160%);
    -webkit-backdrop-filter:blur(22px) saturate(160%);
    border:1px solid rgba(255,255,255,0.10);
    box-shadow:0 30px 80px rgba(0,0,0,0.75), inset 0 1px 0 rgba(255,255,255,0.06);
    display:flex; flex-direction:column; gap:28px;
    animation:rise .9s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes rise {
    from { opacity:0; transform:translateY(28px) scale(.98); }
    to   { opacity:1; transform:translateY(0) scale(1); }
  }

  .header { text-align:center; display:flex; flex-direction:column; gap:8px; }
  .header h1 {
    font-size:24px; font-weight:800; letter-spacing:.12em; text-transform:uppercase;
    background:linear-gradient(90deg,#fff 0%,#b8b8b8 50%,#fff 100%);
    background-size:200% auto;
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:shine 4s linear infinite;
  }
  @keyframes shine { to { background-position:200% center; } }
  .header p {
    font-size:12.5px; letter-spacing:.22em;
    color:rgba(255,255,255,0.45); text-transform:uppercase;
  }

  .input-wrap {
    position:relative; border-radius:16px; padding:2px;
    background:conic-gradient(from var(--angle,0deg),#fff,#6b6b6b,#fff,#6b6b6b,#fff);
    animation:rotate-border 6s linear infinite;
    isolation:isolate;
  }
  @property --angle { syntax:"<angle>"; initial-value:0deg; inherits:false; }
  @keyframes rotate-border { to { --angle:360deg; } }
  .input-wrap::after {
    content:""; position:absolute; inset:-6px; border-radius:20px;
    background:inherit; filter:blur(18px); opacity:.55; z-index:-1;
    animation:rotate-border 6s linear infinite;
  }

  #keyInput {
    width:100%; padding:20px 22px; border-radius:14px; border:none; outline:none;
    background:#fff; color:#0a0a0a; font-size:15px; font-weight:600;
    letter-spacing:.06em; text-align:center; caret-color:#000;
    box-shadow:inset 0 2px 10px rgba(0,0,0,.08), inset 0 -1px 0 rgba(0,0,0,.04);
    transition:transform .25s ease, box-shadow .25s ease;
    position:relative; z-index:1;
  }
  #keyInput::placeholder { color:rgba(0,0,0,.28); letter-spacing:.14em; font-weight:500; }
  #keyInput:focus {
    transform:translateY(-1px);
    box-shadow:inset 0 2px 10px rgba(0,0,0,.08),
               0 0 0 4px rgba(255,255,255,.15),
               0 0 40px rgba(255,255,255,.20);
  }

  .buttons {
    display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; margin-top:4px;
  }
  .btn {
    position:relative; padding:15px 10px; border-radius:12px;
    background:transparent; border:1.5px solid rgba(255,255,255,0.28);
    color:#fff; font-size:13px; font-weight:700; letter-spacing:.10em;
    text-transform:uppercase; cursor:pointer; overflow:hidden;
    transition:color .35s ease, border-color .35s ease,
               transform .25s ease, box-shadow .35s ease;
    font-family:inherit;
  }
  .btn::before {
    content:""; position:absolute; inset:0; background:#fff;
    transform:scaleY(0); transform-origin:bottom;
    transition:transform .4s cubic-bezier(.65,0,.35,1);
    z-index:-1;
  }
  .btn:hover {
    color:#0a0a0a; border-color:#fff; transform:translateY(-2px);
    box-shadow:0 10px 28px rgba(255,255,255,.18),
               0 0 0 1px rgba(255,255,255,.5) inset;
  }
  .btn:hover::before { transform:scaleY(1); }
  .btn:active { transform:translateY(0) scale(.98); }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .btn.confirm { background:#fff; color:#0a0a0a; border-color:#fff; }
  .btn.confirm::before { background:#0a0a0a; }
  .btn.confirm:hover {
    color:#fff; border-color:#0a0a0a;
    box-shadow:0 10px 28px rgba(0,0,0,.6),
               0 0 0 1px rgba(255,255,255,.6) inset;
  }

  .status {
    min-height:18px; text-align:center; font-size:12.5px;
    letter-spacing:.08em; color:rgba(255,255,255,.6);
    transition:color .3s ease;
  }
  .status.ok    { color:#7CFFB2; }
  .status.error { color:#FF7C7C; }

  .success {
    display:none; text-align:center; padding:20px;
    border-radius:16px; background:rgba(124,255,178,.08);
    border:1px solid rgba(124,255,178,.35);
    animation:rise .5s ease both;
  }
  .success.show { display:block; }
  .success h2 {
    font-size:18px; color:#7CFFB2; letter-spacing:.1em;
    margin-bottom:8px; font-weight:800;
  }
  .success p {
    font-size:12px; color:rgba(255,255,255,.65); letter-spacing:.06em;
  }

  .gallery-screen {
    position:fixed; inset:0;
    background:linear-gradient(135deg,#ffe4ec 0%,#fff5f8 35%,#ffd6e4 100%);
    z-index:50;
    display:none;
    overflow-y:auto;
    padding:40px 20px 120px;
    animation:fadeIn .6s ease;
  }
  .gallery-screen.show { display:block; }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }

  .gallery-screen::before {
    content:"";
    position:fixed; inset:0;
    background:
      radial-gradient(circle at 15% 20%, rgba(255,105,180,0.18), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(255,182,193,0.25), transparent 45%);
    pointer-events:none;
  }

  .gallery-header {
    position:relative; z-index:2;
    max-width:1100px; margin:0 auto 40px;
    text-align:center;
  }
  .gallery-header h1 {
    font-size:34px; font-weight:900;
    letter-spacing:.20em;
    color:#d6336c;
    text-transform:uppercase;
    text-shadow:0 2px 20px rgba(214,51,108,0.15);
    margin-bottom:8px;
  }
  .gallery-header p {
    font-size:12px; letter-spacing:.30em;
    color:#b8477a;
    text-transform:uppercase;
  }
  .gallery-header::after {
    content:"";
    display:block; width:60px; height:2px;
    background:linear-gradient(90deg,transparent,#ff69b4,transparent);
    margin:16px auto 0;
  }

  .movie-grid {
    position:relative; z-index:2;
    max-width:1100px; margin:0 auto;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(200px, 1fr));
    gap:28px;
  }

  .movie-card {
    background:#fff;
    border-radius:16px;
    overflow:hidden;
    cursor:pointer;
    position:relative;
    box-shadow:0 8px 24px rgba(214,51,108,0.10), 0 2px 6px rgba(0,0,0,0.04);
    border:2px solid #ffe4ec;
    transition:transform .35s cubic-bezier(.16,1,.3,1),
               box-shadow .35s ease, border-color .35s ease;
    animation:cardIn .6s ease both;
  }
  @keyframes cardIn {
    from { opacity:0; transform:translateY(20px); }
    to   { opacity:1; transform:translateY(0); }
  }
  .movie-card:nth-child(1) { animation-delay:0.05s; }
  .movie-card:nth-child(2) { animation-delay:0.10s; }
  .movie-card:nth-child(3) { animation-delay:0.15s; }
  .movie-card:nth-child(4) { animation-delay:0.20s; }
  .movie-card:nth-child(5) { animation-delay:0.25s; }
  .movie-card:nth-child(6) { animation-delay:0.30s; }
  .movie-card:nth-child(7) { animation-delay:0.35s; }
  .movie-card:nth-child(8) { animation-delay:0.40s; }
  .movie-card:nth-child(9) { animation-delay:0.45s; }

  .movie-card:hover {
    transform:translateY(-8px) scale(1.02);
    box-shadow:0 20px 40px rgba(214,51,108,0.25);
    border-color:#ff69b4;
  }
  .movie-card:hover .movie-poster::after { opacity:1; }
  .movie-card:hover .play-icon {
    transform:scale(1) rotate(0deg);
    opacity:1;
  }

  .movie-poster {
    position:relative;
    width:100%;
    aspect-ratio:2/3;
    background:linear-gradient(135deg,#ffd6e4,#ffe4ec);
    overflow:hidden;
  }
  .movie-poster::after {
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(180deg, transparent 40%, rgba(214,51,108,0.6) 100%);
    opacity:0;
    transition:opacity .3s ease;
  }
  .movie-poster img {
    width:100%; height:100%;
    object-fit:cover;
    display:block;
    transition:transform .5s ease;
  }
  .movie-card:hover .movie-poster img { transform:scale(1.1); }

  .play-icon {
    position:absolute; top:50%; left:50%;
    width:56px; height:56px;
    margin:-28px 0 0 -28px;
    background:rgba(255,255,255,0.95);
    border-radius:50%;
    display:grid; place-items:center;
    transform:scale(0.5) rotate(-90deg);
    opacity:0;
    transition:transform .35s cubic-bezier(.16,1,.3,1), opacity .3s;
    z-index:3;
    box-shadow:0 6px 20px rgba(214,51,108,0.4);
  }
  .play-icon svg { width:22px; height:22px; fill:#d6336c; margin-left:3px; }

  .movie-info { padding:16px 18px 18px; }
  .movie-name {
    font-size:15px; font-weight:800;
    color:#2d1a24;
    letter-spacing:.02em;
    margin-bottom:6px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .movie-meta {
    display:flex; align-items:center; gap:8px;
    font-size:11px; color:#b8477a;
    letter-spacing:.08em; text-transform:uppercase;
  }
  .movie-meta .dot {
    width:3px; height:3px; border-radius:50%;
    background:#ffb6c1;
  }
  .movie-meta .rating {
    display:flex; align-items:center; gap:2px;
    color:#ffaa00; font-weight:700;
  }
  .movie-meta .rating svg { width:11px; height:11px; fill:#ffaa00; }

  .player-screen {
    position:fixed; inset:0;
    background:rgba(0,0,0,0.96);
    z-index:100;
    display:none;
    align-items:center;
    justify-content:center;
    animation:fadeIn .4s ease;
  }
  .player-screen.show { display:flex; }

  .player-box {
    position:relative;
    width:92vw;
    max-width:1200px;
    aspect-ratio:16/9;
    background:#000;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 40px 120px rgba(255,105,180,0.25);
  }

  .player-box iframe {
    width:100%; height:100%;
    display:block;
    border:none;
    background:#000;
  }

  .player-title {
    position:absolute; top:0; left:0; right:0;
    padding:24px 90px 24px 80px;
    background:linear-gradient(180deg, rgba(0,0,0,0.85), transparent);
    color:#fff;
    font-size:18px; font-weight:800;
    letter-spacing:.05em;
    pointer-events:none;
    z-index:5;
    opacity:0;
    transition:opacity .3s ease;
  }
  .player-title.show { opacity:1; }

  .back-btn {
    position:absolute; top:18px; left:18px;
    width:44px; height:44px;
    border-radius:50%;
    background:rgba(255,255,255,0.12);
    border:1.5px solid rgba(255,255,255,0.3);
    color:#fff;
    display:grid; place-items:center;
    cursor:pointer;
    z-index:10;
    backdrop-filter:blur(10px);
    transition:all .25s ease;
  }
  .back-btn:hover {
    background:#ff69b4;
    border-color:#ff69b4;
    transform:scale(1.08);
  }
  .back-btn svg {
    width:20px; height:20px; stroke:#fff; fill:none; stroke-width:2.5;
    stroke-linecap:round; stroke-linejoin:round;
  }

  .bottom-nav {
    position:fixed;
    bottom:0; left:0; right:0;
    height:70px;
    background:rgba(255,255,255,0.92);
    backdrop-filter:blur(24px) saturate(180%);
    -webkit-backdrop-filter:blur(24px) saturate(180%);
    border-top:1px solid rgba(255,105,180,0.25);
    display:none;
    z-index:60;
    box-shadow:0 -10px 30px rgba(214,51,108,0.08);
    padding-bottom:env(safe-area-inset-bottom, 0);
  }
  .bottom-nav.show { display:flex; }

  .bottom-nav-inner {
    max-width:1100px;
    margin:0 auto;
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:60px;
    padding:0 20px;
  }

  .nav-btn {
    background:transparent;
    border:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    cursor:pointer;
    padding:10px 22px;
    border-radius:14px;
    color:#b8477a;
    transition:all .25s ease;
    font-family:inherit;
    position:relative;
  }
  .nav-btn i { font-size:20px; transition:transform .25s ease; }
  .nav-btn span {
    font-size:10.5px;
    font-weight:700;
    letter-spacing:.10em;
    text-transform:uppercase;
  }
  .nav-btn:hover {
    color:#d6336c;
    background:rgba(255,105,180,0.10);
  }
  .nav-btn:hover i { transform:translateY(-2px) scale(1.1); }
  .nav-btn.active { color:#d6336c; }
  .nav-btn.active::after {
    content:"";
    position:absolute;
    bottom:2px;
    left:50%;
    transform:translateX(-50%);
    width:20px;
    height:3px;
    background:linear-gradient(90deg,#ff69b4,#d6336c);
    border-radius:2px;
  }

  .profile-overlay {
    position:fixed; inset:0;
    background:rgba(0,0,0,0.55);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    z-index:200;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    animation:fadeIn .3s ease;
  }
  .profile-overlay.show { display:flex; }

  .profile-box {
    width:100%;
    max-width:420px;
    background:linear-gradient(180deg,#fff 0%,#fff5f8 100%);
    border-radius:24px;
    padding:36px 30px 28px;
    box-shadow:0 30px 80px rgba(214,51,108,0.35);
    border:2px solid #ffe4ec;
    animation:profileIn .45s cubic-bezier(.16,1,.3,1);
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  @keyframes profileIn {
    from { opacity:0; transform:scale(.9) translateY(20px); }
    to   { opacity:1; transform:scale(1) translateY(0); }
  }

  .profile-box::before {
    content:"";
    position:absolute;
    top:-80px; right:-80px;
    width:200px; height:200px;
    background:radial-gradient(circle, rgba(255,105,180,0.25), transparent 70%);
    border-radius:50%;
  }
  .profile-box::after {
    content:"";
    position:absolute;
    bottom:-80px; left:-80px;
    width:200px; height:200px;
    background:radial-gradient(circle, rgba(255,182,193,0.25), transparent 70%);
    border-radius:50%;
  }

  .profile-icon {
    width:80px; height:80px;
    margin:0 auto 18px;
    background:linear-gradient(135deg,#ff69b4,#d6336c);
    border-radius:50%;
    display:grid; place-items:center;
    box-shadow:0 10px 30px rgba(214,51,108,0.35);
    position:relative;
    z-index:1;
  }
  .profile-icon i { font-size:34px; color:#fff; }

  .profile-title {
    font-size:13px;
    letter-spacing:.20em;
    color:#b8477a;
    text-transform:uppercase;
    font-weight:700;
    margin-bottom:8px;
    position:relative;
    z-index:1;
  }

  .profile-key {
    font-size:15px;
    font-weight:800;
    color:#2d1a24;
    font-family:'Courier New',monospace;
    letter-spacing:.02em;
    padding:14px 16px;
    background:#ffe4ec;
    border:1.5px solid #ffb6c1;
    border-radius:12px;
    margin-bottom:14px;
    word-break:break-all;
    position:relative;
    z-index:1;
  }

  .profile-vn-time {
    font-size:11px;
    color:#b8477a;
    font-family:'Courier New',monospace;
    letter-spacing:.05em;
    margin-bottom:20px;
    position:relative;
    z-index:1;
  }

  .profile-divider {
    height:1px;
    background:linear-gradient(90deg,transparent,#ffb6c1,transparent);
    margin:20px 0;
    position:relative;
    z-index:1;
  }

  .countdown-label {
    font-size:11px;
    letter-spacing:.20em;
    color:#b8477a;
    text-transform:uppercase;
    font-weight:700;
    margin-bottom:10px;
    position:relative;
    z-index:1;
  }

  .countdown-timer {
    display:flex;
    justify-content:center;
    gap:10px;
    margin-bottom:22px;
    position:relative;
    z-index:1;
  }

  .countdown-block {
    background:linear-gradient(135deg,#fff,#ffe4ec);
    border:2px solid #ffb6c1;
    border-radius:12px;
    padding:10px 14px;
    min-width:64px;
    box-shadow:0 4px 12px rgba(214,51,108,0.10);
  }
  .countdown-num {
    font-size:24px;
    font-weight:900;
    color:#d6336c;
    font-family:'Courier New',monospace;
    line-height:1;
    margin-bottom:2px;
  }
  .countdown-unit {
    font-size:9.5px;
    letter-spacing:.14em;
    color:#b8477a;
    text-transform:uppercase;
    font-weight:700;
  }

  .logout-btn {
    width:100%;
    padding:15px;
    border-radius:14px;
    border:2px solid #ffb6c1;
    background:#fff;
    color:#d6336c;
    font-size:13px;
    font-weight:800;
    letter-spacing:.12em;
    text-transform:uppercase;
    cursor:pointer;
    transition:all .25s ease;
    font-family:inherit;
    position:relative;
    z-index:1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  .logout-btn:hover {
    background:linear-gradient(135deg,#d6336c,#ff69b4);
    color:#fff;
    border-color:#d6336c;
    transform:translateY(-2px);
    box-shadow:0 10px 25px rgba(214,51,108,0.4);
  }
  .logout-btn:active { transform:translateY(0) scale(.98); }

  .close-profile {
    position:absolute;
    top:14px; right:14px;
    width:36px; height:36px;
    border-radius:50%;
    background:rgba(255,255,255,0.6);
    border:1.5px solid #ffb6c1;
    color:#d6336c;
    cursor:pointer;
    display:grid; place-items:center;
    z-index:10;
    transition:all .2s ease;
  }
  .close-profile:hover {
    background:#d6336c;
    color:#fff;
    transform:rotate(90deg);
  }
  .close-profile i { font-size:16px; }

  @media (max-width:460px) {
    .menu { padding:36px 22px 32px; gap:22px; }
    .buttons { grid-template-columns:1fr; }
    .header h1 { font-size:19px; }
    #keyInput { padding:17px 16px; font-size:14px; }
    .gallery-header h1 { font-size:24px; }
    .movie-grid { grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:16px; }
    .player-box { width:96vw; border-radius:10px; }
    .back-btn { width:38px; height:38px; top:12px; left:12px; }
    .bottom-nav-inner { gap:30px; }
    .nav-btn { padding:8px 16px; }
    .countdown-block { min-width:54px; padding:8px 10px; }
    .countdown-num { font-size:20px; }
  }
</style>
</head>
<body>

<div class="orb one"></div>
<div class="orb two"></div>

<main class="menu" id="keyScreen">
  <div class="header">
    <h1>NHẬP KEY XÁC MINH</h1>
    <p>NHẬP KEY ĐỂ XÁC THỰC</p>
  </div>

  <div class="input-wrap">
    <input id="keyInput" type="text" placeholder="NHẬP KEY CỦA BẠN" autocomplete="off" spellcheck="false" />
  </div>

  <div class="buttons">
    <button class="btn" id="btnGet">Get Key</button>
    <button class="btn" id="btnPaste">Dán Key</button>
    <button class="btn confirm" id="btnConfirm">Xác Nhận</button>
  </div>

  <div class="status" id="status"></div>

  <div class="success" id="successBox">
    <h2>✅ XÁC THỰC THÀNH CÔNG</h2>
    <p>Key hợp lệ — đang mở thư viện phim...</p>
  </div>
</main>
